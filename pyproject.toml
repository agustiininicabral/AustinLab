[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "austinlab"
version = "0.1.0"
description = "Offline static HTML quality assurance auditor"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

[project.scripts]
austinlab = "austinlab.cli:main"

[tool.setuptools.packages.find]
include = ["austinlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
