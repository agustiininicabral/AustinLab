name: AustinLab QA CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check austinlab tests
      - run: ruff format --check austinlab tests
      - run: pytest -q
      - name: Run demo
        run: |
          set +e
          python -m austinlab audit --input examples/sample_page.html --out outputs
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 1
          test -s outputs/report.json
          test -s outputs/report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: austinlab-audit-report
          path: outputs/
          if-no-files-found: warn
          retention-days: 7
